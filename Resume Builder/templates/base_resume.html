<!DOCTYPE html>
<html>
<head>

    <title>Resume Builder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

    body{
        background:#f4f4f4;
    }

    .resume-container{
        width:80%;
        margin:auto;
        margin-top:40px;
        background:white;
        padding:40px;
        border-radius:15px;
        box-shadow:0 0 20px rgba(0,0,0,0.1);
    }

    </style>

</head>

<body>

<div class="resume-container">

{% block content %}
{% endblock %}

<hr>

<div class="mt-4">

    <a href="/"
       class="btn btn-primary">
       Create Resume
    </a>

    <a href="/dashboard"
       class="btn btn-success">
       Dashboard
    </a>

</div>

</div>

</body>
</html>
