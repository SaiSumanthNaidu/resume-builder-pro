<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Resume Builder</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            Resume Builder
        </a>

        <div>
            <a href="/" class="btn btn-outline-light me-2">
                Home
            </a>

            <a href="/dashboard" class="btn btn-primary">
                Dashboard
            </a>
        </div>

    </div>

</nav>

<div class="container mt-4">

    <!-- HERO -->

    <div class="hero-section">

        <h1>
            Build Your Professional Resume
        </h1>

        <p>
            Create ATS-Friendly Resumes &
            Download PDF Instantly
        </p>

    </div>

    <form action="/generate" method="POST">

        <!-- PERSONAL INFORMATION -->

        <div class="form-section">

            <h3 class="section-title">
                Personal Information
            </h3>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Full Name</label>

                    <input type="text"
                           name="full_name"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Email</label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           required>

                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <label>Phone</label>

                    <input type="text"
                           name="phone"
                           class="form-control">

                </div>

                <div class="col-md-4 mb-3">

                    <label>LinkedIn</label>

                    <input type="text"
                           name="linkedin"
                           class="form-control">

                </div>

                <div class="col-md-4 mb-3">

                    <label>GitHub</label>

                    <input type="text"
                           name="github"
                           class="form-control">

                </div>

            </div>

            <div class="mb-3">

                <label>Portfolio Website</label>

                <input type="text"
                       name="portfolio"
                       class="form-control">

            </div>

        </div>

        <!-- PROFESSIONAL DETAILS -->

        <div class="form-section">

            <h3 class="section-title">
                Professional Details
            </h3>

            <div class="mb-3">

                <label>Professional Summary</label>

                <textarea name="summary"
                          rows="4"
                          class="form-control"></textarea>

            </div>

            <div class="mb-3">

                <label>Skills</label>

                <textarea name="skills"
                          rows="4"
                          class="form-control"></textarea>

            </div>

            <div class="mb-3">

                <label>Experience</label>

                <textarea name="experience"
                          rows="4"
                          class="form-control"></textarea>

            </div>

        </div>

        <!-- ACADEMIC DETAILS -->

        <div class="form-section">

            <h3 class="section-title">
                Academic Details
            </h3>

            <div class="mb-3">

                <label>Education</label>

                <textarea name="education"
                          rows="4"
                          class="form-control"></textarea>

            </div>

            <div class="mb-3">

                <label>Certifications</label>

                <textarea name="certifications"
                          rows="4"
                          class="form-control"></textarea>

            </div>

        </div>

        <!-- ADDITIONAL DETAILS -->

        <div class="form-section">

            <h3 class="section-title">
                Additional Details
            </h3>

            <div class="mb-3">

                <label>Projects</label>

                <textarea name="projects"
                          rows="4"
                          class="form-control"></textarea>

            </div>

            <div class="mb-3">

                <label>Languages</label>

                <textarea name="languages"
                          rows="3"
                          class="form-control"></textarea>

            </div>

            <div class="mb-3">

                <label>Achievements</label>

                <textarea name="achievements"
                          rows="3"
                          class="form-control"></textarea>

            </div>

        </div>

        <!-- TEMPLATE SECTION -->

       <div class="form-section">

    <h3 class="section-title">
        CHOOSE RESUME TEMPLATE
    </h3>

    <div class="row g-3">

        <div class="col-md-4">

            <label>

                <input
                    class="template-radio"
                    type="radio"
                    name="template"
                    value="template1"
                    checked>

                <div class="template-card">

                    <div class="card-body">

                        <div style="font-size:48px;">
                            💼
                        </div>

                        <h5>
                            Professional
                        </h5>

                    </div>

                </div>

            </label>

        </div>

        <div class="col-md-4">

            <label>

                <input
                    class="template-radio"
                    type="radio"
                    name="template"
                    value="template2">

                <div class="template-card">

                    <div class="card-body">

                        <div style="font-size:48px;">
                            📊
                        </div>

                        <h5>
                            Modern
                        </h5>

                    </div>

                </div>

            </label>

        </div>

        <div class="col-md-4">

            <label>

                <input
                    class="template-radio"
                    type="radio"
                    name="template"
                    value="template3">

                <div class="template-card">

                    <div class="card-body">

                        <div style="font-size:48px;">
                            🎨
                        </div>

                        <h5>
                            Creative
                        </h5>

                    </div>

                </div>

            </label>

        </div>

    </div>

</div>
        <button class="btn btn-primary btn-custom w-100 mb-5">

            Generate Resume

        </button>

    </form>

</div>

</body>
</html>
