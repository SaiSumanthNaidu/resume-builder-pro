<!DOCTYPE html>
<html>
<head>

<title>Edit Resume</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1>Edit Resume</h1>

<form method="POST">

<input type="text"
       name="full_name"
       value="{{ resume.full_name }}"
       class="form-control mb-3">

<input type="email"
       name="email"
       value="{{ resume.email }}"
       class="form-control mb-3">

<input type="text"
       name="phone"
       value="{{ resume.phone }}"
       class="form-control mb-3">

<textarea name="summary"
          class="form-control mb-3"
          rows="4">{{ resume.summary }}</textarea>

<textarea name="education"
          class="form-control mb-3"
          rows="4">{{ resume.education }}</textarea>

<textarea name="skills"
          class="form-control mb-3"
          rows="4">{{ resume.skills }}</textarea>

<textarea name="experience"
          class="form-control mb-3"
          rows="4">{{ resume.experience }}</textarea>

<textarea name="projects"
          class="form-control mb-3"
          rows="4">{{ resume.projects }}</textarea>

<textarea name="certifications"
          class="form-control mb-3"
          rows="4">{{ resume.certifications }}</textarea>

<textarea name="languages"
          class="form-control mb-3"
          rows="3">{{ resume.languages }}</textarea>

<textarea name="achievements"
          class="form-control mb-3"
          rows="3">{{ resume.achievements }}</textarea>

<input type="text"
       name="linkedin"
       value="{{ resume.linkedin }}"
       class="form-control mb-3"
       placeholder="LinkedIn">

<input type="text"
       name="github"
       value="{{ resume.github }}"
       class="form-control mb-3"
       placeholder="GitHub">

<input type="text"
       name="portfolio"
       value="{{ resume.portfolio }}"
       class="form-control mb-3"
       placeholder="Portfolio">

<button class="btn btn-success">
    Update Resume
</button>

</form>

</div>

</body>
</html>
